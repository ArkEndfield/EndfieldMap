<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="description"
      content="明日方舟终末地-终末地地图站(zmdmap.com)"
    />
    <meta
      name="keywords"
      content="明日方舟,终末地,明日方舟终末地,终末地地图,zmdmap,zhongmodi,endfield,arknights,アークナイツ：エンドフィールド,终末地wiki,绝命笋干,地图站,zmdwiki"
    />
    <title>终末地地图资源查询</title>
    <style>
      body {
        background-color: #222;
      }

      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 1s ease-out;
        background-color: #222;
        background-image: url("/images/loading_bg.jpg");
        background-position: 50%;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .loading-container {
        display: flex;
        align-items: center;
        width: 100%;
      }

      .loading-bar-left,
      .loading-bar-right {
        flex: 1;
        height: 15px;
        background-color: #333;
        position: relative;
      }

      .loading-bar-left::before,
      .loading-bar-right::before {
        content: "";
        display: block;
        position: absolute;
        top: 0;
        width: 3px;
        height: 15px;
        background-color: #ffff56;
      }

      .loading-bar-left::before {
        right: -6px;
      }

      .loading-bar-right::before {
        left: -6px;
      }

      .loading-bar-progress-left {
        position: absolute;
        top: 0;
        height: 100%;
        width: 0%;
        background-color: #ffff56;
        transition: width 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        will-change: width;
      }

      .loading-bar-progress-right {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        width: 0%;
        background-color: #ffff56;
        transition: width 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        will-change: width;
      }

      .loading-center {
        flex-shrink: 0;
        margin: 0 20px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .loading-bg {
        animation: loading-shin 4s ease-in-out infinite;
        background-image: url("/images/loading_icon_bg.png");
        background-size: 100%;
        height: 10.7664rem;
        position: relative;
        width: 10rem;
      }

      .loading-logo {
        animation: loading-shin 4s ease-in-out infinite;
        background-image: url("/images/loading_icon.png");
        background-size: 100%;
        height: 10.7664rem;
        position: relative;
        width: 10rem;
      }

      .loading-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: "Arial", sans-serif;
        font-size: 22px;
        font-weight: bold;
        color: #ffff56;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        white-space: nowrap;
        z-index: 1;
      }

      @keyframes loading-shin {
        0% {
          opacity: 1;
        }

        50% {
          opacity: 0.4;
        }

        100% {
          opacity: 1;
        }
      }

      .loading-bar-complete {
        width: 100% !important;
        transition: none !important;
      }

      #app {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }

      #app.app-ready {
        opacity: 1;
      }

      .loading-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-transition-active {
        z-index: 10;
      }
    </style>
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "r2luqho25g");
    </script>
  </head>

  <body>
    <div id="app-loading">
      <div class="loading-container">
        <div class="loading-bar-left">
          <div class="loading-bar-progress-left"></div>
        </div>
        <div class="loading-center">
          <div class="loading-text">0%</div>
          <div class="loading-logo"></div>
        </div>
        <div class="loading-bar-right">
          <div class="loading-bar-progress-right"></div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 监听应用加载完成事件
      window.addEventListener("app-loading-complete", function () {
        // 获取元素引用
        const appElem = document.getElementById("app");
        const loadingElem = document.getElementById("app-loading");

        // 使用requestAnimationFrame确保流畅过渡
        requestAnimationFrame(function () {
          // 先让app元素开始准备显示
          appElem.classList.add("app-ready");
          appElem.classList.add("app-transition-active");
        });
      });
    </script>
  </body>
</html>
