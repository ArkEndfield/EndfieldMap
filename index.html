<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0" />
    <title>终末地地图资源查询</title>
    <meta
      name="keywords"
      content="明日方舟,终末地,明日方舟终末地,终末地地图,zmdmap,zhongmodi,endfield,arknights,アークナイツ：エンドフィールド,终末地wiki,绝命笋干,地图站,zmdwiki,养成材料,醚质,资源查询,宝箱位置,故障,机器人,位置,攻略,aulylene,resources,material,chest,damaged,robot"
    />
    <meta name="description" content="终末地地图站, 一站式查询地图所有资源点位。从宝箱和醚质，到纸条或故障机器人攻略，应有尽有。Endfield Interactive Map, find every resource you need all at once. From precious chests and aurylene, to well-hidden narratives or complex damage robots." />
  </head>
  <body>
    <div id="root"></div>

    <!-- 初始加载界面，React 加载完成后移除 -->
    <div id="initial-loader" class="initial-loader">
      <div id="loader-bg" class="loader-bg"></div>
      <div id="loader-wipe" class="loader-wipe"></div>
      <div class="loader-content">
        <!-- 去掉 Logo 展示 -->
        <div class="loader-progress-container">
          <div class="loader-progress-bar-wrapper">
            <!-- 新增 wrapper 用于小屏布局 -->
            <div class="loader-progress-bar">
              <div class="loader-progress-fill" id="progress-fill"></div>
            </div>

            <!-- 新设计的文本容器，跟随进度条移动 -->
            <div class="loader-text-container" id="progress-text-container">
              <div class="loader-deco-line"></div>
              <div class="loader-percent"><span id="progress-text">0</span>%</div>
              <div class="loader-status">
                <div class="loader-dots" id="loader-dots"><span></span><span></span></div>
                <div class="loader-status-text" id="loader-status-text">Updating...</div>
              </div>
            </div>
          </div>
        </div>
        <div class="loader-error" id="loader-error" style="display: none">
          <div class="loader-error-title">ERROR</div>
          <div class="loader-error-msg" id="loader-error-msg"></div>
          <div class="loader-error-action">Please refresh the page to try again</div>
        </div>
      </div>
    </div>

    <style>
      .initial-loader {
        position: fixed;
        inset: 0;
        background: #141414;
        z-index: 9999;
        --loader-color: #fefa53;
        --loader-text-gray: #888;
        --loading-progress: 0;
      }

      .loader-bg {
        position: absolute;
        inset: 0;
        background-image: url('/images/bg/page-bg-dark.jpg');
        background-size: cover;
        background-position: center;
        z-index: 0;
        filter: blur(calc(20px * (1 - var(--loading-progress) / 100)));
        transform: scale(1.1); /* 防止模糊边缘露底 */
        transition: filter 0.1s linear;
      }

      .loader-wipe {
        position: absolute;
        top: 0;
        left: 0;
        width: 0%;
        height: 100%;
        background-color: var(--loader-color);
        z-index: 10000;
        transition: width 0.5s cubic-bezier(0.65, 0, 0.35, 1); /* 0.5s 展开 */
      }

      .initial-loader.wiping .loader-wipe {
        width: 100%;
      }

      .initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease-out; /* 展开后淡出 */
      }

      .loader-content {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      /* 默认大屏幕样式：左侧竖向，贴边占满，从上到下 */
      .loader-progress-container {
        position: absolute;
        left: 0;
        top: 0;
        height: 100vh; /* 占满高度 */
        width: 10px; /* 增加粗细到 10px */
        display: flex;
        flex-direction: column; /* 从上到下 */
      }

      /* 统一使用 wrapper，确保高度和宽度在不同屏幕下行为一致 */
      .loader-progress-bar-wrapper {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .loader-progress-bar {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .loader-progress-fill {
        width: 100%;
        height: calc(var(--loading-progress) * 1%); /* 竖向高度变化 */
        background: var(--loader-color);
        transition: height 0.3s ease-out;
        position: absolute;
        top: 0; /* 从顶部开始 */
        left: 0;
      }

      /* 新的文本容器样式 */
      .loader-text-container {
        position: absolute; /* 改为 absolute 以跟随父容器 */
        left: 20px; /* PC 端初始左边距 */
        top: calc(var(--loading-progress) * 1%);
        transform: translateY(-100%); /* 默认向上偏移 */
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        pointer-events: none;
        transition: top 0.3s ease-out; /* PC 端跟随动画 */
      }

      .loader-deco-line {
        width: 2px;
        height: 8px;
        background-color: var(--loader-color);
        margin-bottom: 2px;
        border-radius: 1px;
      }

      .loader-percent {
        font-size: 24px;
        font-weight: bold;
        color: var(--loader-color);
        line-height: 1;
        letter-spacing: -1px;
      }

      .loader-status {
        margin-top: 3px;
      }

      .loader-dots {
        display: flex;
        gap: 2px;
        margin-bottom: 2px;
      }

      .loader-dots span {
        width: 3px;
        height: 3px;
        background-color: #666;
        display: block;
      }

      .loader-dots span:first-child {
        background-color: #888;
      }

      .loader-status-text {
        font-size: 10px;
        color: var(--loader-text-gray);
        letter-spacing: 0.5px;
      }

      .loader-error {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 500px;
        padding: 24px;
        background: rgba(20, 20, 20, 0.95);
        border: 1px solid #ff4d4f;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        text-align: center;
        z-index: 20000;
        color: #ff4d4f;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        backdrop-filter: blur(10px);
      }

      .loader-error-title {
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }

      .loader-error-msg {
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 4px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .loader-error-action {
        font-size: 10px;
        opacity: 0.6;
      }

      /* 小屏幕适配：底部横向 */
      @media (max-width: 768px) {
        .loader-progress-container {
          /* position: absolute; left: 0; display: flex; 继承自默认样式 */
          top: auto;
          bottom: 100px; /* 恢复原有的底部距离，避免贴底 */
          width: 90vw; /* 恢复宽度限制 */
          height: 14px;
          flex-direction: row; /* 横向 */
          align-items: center;
        }

        /* 进度条容器，留出右侧空间给文本，防止跟随的文本溢出屏幕 */
        .loader-progress-bar-wrapper {
          flex: 1;
          height: 10px;
          /* position: relative; 继承自默认样式 */
          margin-right: 40px; /* 预留右侧空间 */
          width: auto; /* 覆盖默认 */
        }

        /* .loader-progress-bar 样式完全继承自默认样式，无需重写 */

        .loader-progress-fill {
          width: calc(var(--loading-progress) * 1%); /* 横向宽度变化 */
          height: 100%;
          /* position, top, left 继承自默认样式 */
          transition: width 0.3s ease-out;
        }

        .loader-text-container {
          left: calc(var(--loading-progress) * 1%);
          top: 50%;
          transform: translate(10px, -50%); /* 在进度条右侧，垂直居中 */
          transition: left 0.3s ease-out; /* Mobile 端跟随动画 */
        }

        .loader-percent {
          font-size: 24px;
        }
      }
    </style>

    <script>
      // 初始化进度（在 React 加载前就开始）
      window.__LOADING_PROGRESS__ = {
        current: 0,
        target: 0,
        stages: {},

        update(stage, progress) {
          if (this.error) return;
          this.stages[stage] = progress;
          this.calculateTotal();
        },

        fail(error) {
          this.error = error;
          this.renderError();
        },

        calculateTotal() {
          // 简单的加权平均
          const weights = {
            INIT: 5,
            I18N: 15,
            STORAGE: 10,
            COMPONENTS: 20,
            MAP_ADAPTER: 15,
            MAP_RENDER: 20,
            ENTITY_RENDER: 15,
          };
          let total = 0;
          // 总权重应为所有预定义权重的和：5+15+10+20+15+20+15 = 100
          const totalPossibleWeight = 100;

          for (const [stage, progress] of Object.entries(this.stages)) {
            const weight = weights[stage] || 0;
            total += (progress / 100) * weight;
          }

          this.target = Math.min(100, (total / totalPossibleWeight) * 100);

          // 防止初始计算过低
          if (Object.keys(this.stages).length === 1 && this.stages.INIT) {
            this.target = Math.max(5, this.target);
          }
        },

        animate() {
          const diff = this.target - this.current;
          if (Math.abs(diff) > 0.1) {
            this.current += diff * 0.1;
            // 确保显示进度不超过 100
            this.current = Math.min(100, this.current);
            this.render();
          } else if (this.target >= 100 && this.current < 100) {
            // 强制完成
            this.current = 100;
            this.render();
          }

          // 如果未完成或需要继续渲染动画（例如淡出前最后一帧），继续循环
          // 只有当完全结束并且 React 组件接管后调用 hide 才会真正停止
          // 这里保持 loop 直到元素被移除
          if (document.getElementById('initial-loader')) {
            requestAnimationFrame(() => this.animate());
          }
        },

        render() {
          if (this.error) return;

          const loader = document.getElementById('initial-loader');
          const text = document.getElementById('progress-text');
          const displayValue = Math.min(100, Math.round(this.current));

          // 更新 CSS 变量，由 CSS 处理布局和样式
          if (loader) {
            loader.style.setProperty('--loading-progress', this.current);
          }

          if (text) {
            text.textContent = displayValue;
          }
        },

        renderError() {
          const fill = document.getElementById('progress-fill');
          const percent = document.querySelector('.loader-percent');
          const decoLine = document.querySelector('.loader-deco-line');
          const dots = document.getElementById('loader-dots');
          const statusText = document.getElementById('loader-status-text');
          const errorDiv = document.getElementById('loader-error');
          const errorMsg = document.getElementById('loader-error-msg');

          if (fill) fill.style.backgroundColor = '#ff4d4f';
          if (percent) percent.style.color = '#ff4d4f';
          if (decoLine) decoLine.style.backgroundColor = '#ff4d4f';

          if (dots) {
            const dotSpans = dots.querySelectorAll('span');
            dotSpans.forEach((span) => (span.style.backgroundColor = '#ff4d4f'));
          }

          if (statusText) {
            statusText.textContent = 'Error';
            statusText.style.color = '#ff4d4f';
          }

          if (errorDiv && errorMsg && this.error) {
            errorDiv.style.display = 'block';
            errorMsg.textContent = this.error.message || String(this.error);
          }
        },

        hide() {
          const loader = document.getElementById('initial-loader');
          const progressFill = document.getElementById('progress-fill');

          if (loader && progressFill) {
            // 获取 transition 时间，确保进度条跑完
            const transitionDuration = parseFloat(getComputedStyle(progressFill).transitionDuration) * 1000;
            const waitTime = Math.max(transitionDuration, 300);

            // 额外展示时间，让用户看清 100%
            const displayTime = 500;

            setTimeout(() => {
              // 第一阶段：开始 wipe 动画
              loader.classList.add('wiping');

              // 第二阶段：wipe 动画完成后 (0.5s)，开始淡出
              setTimeout(() => {
                loader.classList.add('fade-out');
                // 第三阶段：淡出完成后 (0.5s)，移除元素
                setTimeout(() => loader.remove(), 500);
              }, 500); // wipe duration
            }, waitTime + displayTime);
          } else if (loader) {
            // 降级处理
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 500);
          }
        },
      };

      // 启动动画
      window.__LOADING_PROGRESS__.animate();
      // 初始阶段
      window.__LOADING_PROGRESS__.update('INIT', 100);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
