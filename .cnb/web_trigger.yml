branch:
  - buttons:
      - name: 执行部署
        description: 手动触发部署流程
        event: web_trigger_deploy_map_web
        permissions:
          roles:
            - owner
            - master
      - name: 发布包到 GitHub Packages
        description: 手动触发发布 @endfieldmap 所有包到 GitHub Packages
        event: web_trigger_publish_github
        permissions:
          roles:
            - owner
            - master
      - name: 发布包到 npm
        description: 手动触发发布 @endfieldmap 所有包到 npm
        event: web_trigger_publish_npm
        permissions:
          roles:
            - owner
            - master
      - name: 部署组件文档
        description: 手动触发组件文档部署流程
        event: web_trigger_deploy_components_docs
        permissions:
          roles:
            - owner
            - master
