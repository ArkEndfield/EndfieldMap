environments:
  - name: release
    description: 只执行发版操作
    label: 发版
    env:
      name: release
      tag_name: $CNB_BRANCH
    permissions:
      roles:
        - developer
        - master
    require:
      - approver:
          users:
            - bietiaop
    button:
      - name: 执行发版
        event: web_trigger_release
        description: 手动触发发版流程
        permissions:
          roles:
            - developer
            - master
  - name: deploy
    description: 只执行部署操作
    label: 部署
    env:
      name: deploy
      tag_name: $CNB_BRANCH
    permissions:
      roles:
        - developer
        - master
    require:
      - approver:
          users:
            - bietiaop
    button:
      - name: 执行部署
        event: web_trigger_deploy
        description: 手动触发部署流程
        permissions:
          roles:
            - developer
            - master
  - name: production
    description: 执行发版和部署操作
    label: 发版和部署
    env:
      name: production
      tag_name: $CNB_BRANCH
    permissions:
      roles:
        - developer
        - master
    require:
      - approver:
          users:
            - bietiaop
    button:
      - name: 执行发版和部署
        event: web_trigger_production
        description: 手动触发发版和部署流程
        permissions:
          roles:
            - developer
            - master