        background-color: var(--loader-color);
        z-index: 10000;
        transition: width 0.5s cubic-bezier(0.65, 0, 0.35, 1); /* 0.5s 展开 */
      }

      .initial-loader.wiping .loader-wipe {
        width: 100%;
      }

      .initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease-out; /* 展开后淡出 */
      }

      .loader-content {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      /* 默认大屏幕样式：左侧竖向，贴边占满，从上到下 */
      .loader-progress-container {
        position: absolute;
        left: 0;
        top: 0;
        height: 100vh; /* 占满高度 */
        width: 10px; /* 增加粗细到 10px */
        display: flex;
        flex-direction: column; /* 从上到下 */
      }

      /* 统一使用 wrapper，确保高度和宽度在不同屏幕下行为一致 */
      .loader-progress-bar-wrapper {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .loader-progress-bar {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .loader-progress-fill {
        width: 100%;
        height: calc(var(--loading-progress) * 1%); /* 竖向高度变化 */
        background: var(--loader-color);
        transition: height 0.3s ease-out;
        position: absolute;
        top: 0; /* 从顶部开始 */
        left: 0;
      }

      /* 新的文本容器样式 */
      .loader-text-container {
        position: absolute; /* 改为 absolute 以跟随父容器 */
        left: 20px; /* PC 端初始左边距 */
        top: calc(var(--loading-progress) * 1%);
        transform: translateY(-100%); /* 默认向上偏移 */
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        pointer-events: none;
        transition: top 0.3s ease-out; /* PC 端跟随动画 */
      }

      .loader-deco-line {
        width: 2px;
        height: 8px;
        background-color: var(--loader-color);
        margin-bottom: 2px;
        border-radius: 1px;
      }

      .loader-percent {
        font-size: 24px;
        font-weight: bold;
        color: var(--loader-color);
        line-height: 1;
        letter-spacing: -1px;
      }

      .loader-status {
        margin-top: 3px;
      }

      .loader-dots {
        display: flex;
        gap: 2px;
        margin-bottom: 2px;
      }

      .loader-dots span {
        width: 3px;
        height: 3px;
        background-color: #666;
        display: block;
      }

      .loader-dots span:first-child {
        background-color: #888;
      }

      .loader-status-text {
        font-size: 10px;
        color: var(--loader-text-gray);
        letter-spacing: 0.5px;
      }

      .loader-error {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 500px;
        padding: 24px;
        background: rgba(20, 20, 20, 0.95);
        border: 1px solid #ff4d4f;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        text-align: center;
        z-index: 20000;
        color: #ff4d4f;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        backdrop-filter: blur(10px);
      }

      .loader-error-title {
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }

      .loader-error-msg {
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 4px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .loader-error-action {
        font-size: 10px;
        opacity: 0.6;
      }

      .loading-logo-container {
        position: absolute;
        width: 25%;
        height: 30%;
        top: 35%;
        left: 70%;
      }

      .loading-logo {
        transform: translate(-50%, -40%);
      }

      .logo-cn {
        position: relative;
        padding-bottom: 9%;
        left: -50%;
        font-size: 15px;
        color: white;
        font-weight: bold;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      .loading-subtitle-container {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.5em;
      }

      .logo-triangle {
        position: relative;
        width: auto;
        height: 1em;
        left: -50%;
      }

      .logo-loading {
        position: relative;
        top: 10%;
        left: -50%;
        font-size: 10px;
        color: white;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transform: scaleX(1.2);
        transform-origin: left;
      }

      .loader-contact {
        position: fixed;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        opacity: 0;
        animation: fadeIn 1.5s ease-in-out forwards;
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
      
      .loader-contact-text {
        font-size: 15px;
        color: #fff;
      }

      .loader-contact-list {
        display: flex;
        gap: 12px;
        color: cornflowerblue;
      }

      .loader-contact-button {
        padding: 2px 12px;
        color: cornflowerblue;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }


      /* 小屏幕适配：底部横向 */
      @media (max-width: 768px) {
        .loader-progress-container {
          top: auto;
          bottom: 100px; /* 恢复原有的底部距离，避免贴底 */
          width: 90vw; /* 恢复宽度限制 */
          height: 14px;
          flex-direction: row; /* 横向 */
          align-items: center;
        }

        /* 进度条容器，留出右侧空间给文本，防止跟随的文本溢出屏幕 */
        .loader-progress-bar-wrapper {
          flex: 1;
          height: 10px;
          margin-right: 40px;
          width: auto;
        }

        .loader-progress-fill {
          width: calc(var(--loading-progress) * 1%); /* 横向宽度变化 */
          height: 100%;
          transition: width 0.3s ease-out;
        }

        .loader-text-container {
          left: calc(var(--loading-progress) * 1%);
          top: 50%;
          transform: translate(10px, -50%); /* 在进度条右侧，垂直居中 */
          transition: left 0.3s ease-out; /* Mobile 端跟随动画 */
        }

        .loading-logo-container {
          width: 70%;
          top: 40%;
          left: 45%;
        }

        .loading-subtitle-container {
          flex-direction: column-reverse;
          gap: 0;
        }

        .loader-contact {
          top: 10%; /* 小屏幕时距离底部更近 */
        }
      }
    </style>

    <script> // SEO 优化：如果不是百度爬虫且浏览器语言不是中文，则修改标题为英文
      const isNotBaidu = !navigator.userAgent.toLowerCase().includes('baiduspider');
      const isNotZh = !navigator.language.startsWith('zh');
      isNotBaidu && isNotZh && (document.title = 'Endfield Interactive Map - ZMDMAP');
    </script>

    <script>
      // 初始化进度（在 React 加载前就开始）
      window.__LOADING_PROGRESS__ = {
        current: 0,
        target: 0,
        stages: {},

        update(stage, progress) {
          if (this.error) return;
          this.stages[stage] = progress;
          this.calculateTotal();
        },

        fail(error) {
          this.error = error;
          this.renderError();
        },

        calculateTotal() {
          // 简单的加权平均
          const weights = {
            INIT: 5,
            I18N: 8,
            STORAGE: 12,
            COMPONENTS: 5,
            MAP_ADAPTER: 10,
            MAP_RENDER: 50,
            ENTITY_RENDER: 10,
          };
          let total = 0;
          // 总权重应为所有预定义权重的和：5+8+12+5+10+50+10 = 100
          const totalPossibleWeight = 100;

          for (const [stage, progress] of Object.entries(this.stages)) {
            const weight = weights[stage] || 0;
            total += (progress / 100) * weight;
          }

          this.target = Math.min(100, (total / totalPossibleWeight) * 100);

          // 防止初始计算过低
          if (Object.keys(this.stages).length === 1 && this.stages.INIT) {
            this.target = Math.max(5, this.target);
          }
        },

        animate() {
          const diff = this.target - this.current;
          if (Math.abs(diff) > 0.1) {
            this.current += diff * 0.1;
            // 确保显示进度不超过 100
            this.current = Math.min(100, this.current);
            this.render();
          } else if (this.target >= 100 && this.current < 100) {
            // 强制完成
            this.current = 100;
            this.render();
          }

          // 如果未完成或需要继续渲染动画（例如淡出前最后一帧），继续循环
          // 只有当完全结束并且 React 组件接管后调用 hide 才会真正停止
          // 这里保持 loop 直到元素被移除
          if (document.getElementById('initial-loader')) {
            requestAnimationFrame(() => this.animate());
          }
        },

        render() {
          if (this.error) return;

          const loader = document.getElementById('initial-loader');
          const text = document.getElementById('progress-text');
          const displayValue = Math.min(100, Math.round(this.current));

          // 更新 CSS 变量，由 CSS 处理布局和样式
          if (loader) {
            loader.style.setProperty('--loading-progress', this.current);
          }

          if (text) {
            text.textContent = displayValue;
          }
        },

        renderError() {
          const fill = document.getElementById('progress-fill');
          const percent = document.querySelector('.loader-percent');
          const decoLine = document.querySelector('.loader-deco-line');
          const dots = document.getElementById('loader-dots');
          const statusText = document.getElementById('loader-status-text');
          const errorDiv = document.getElementById('loader-error');
          const errorMsg = document.getElementById('loader-error-msg');
          const contactDiv = document.getElementById('loader-contact');

          if (fill) fill.style.backgroundColor = '#ff4d4f';
          if (percent) percent.style.color = '#ff4d4f';
          if (decoLine) decoLine.style.backgroundColor = '#ff4d4f';

          if (dots) {
            const dotSpans = dots.querySelectorAll('span');
            dotSpans.forEach((span) => (span.style.backgroundColor = '#ff4d4f'));
          }

          if (statusText) {
            statusText.textContent = 'Error';
            statusText.style.color = '#ff4d4f';
          }

          if (errorDiv && errorMsg && this.error) {
            errorDiv.style.display = 'block';
            errorMsg.textContent = this.error.message || String(this.error);
            contactDiv.style.display = 'flex';
          }
        },

        hide() {
          const loader = document.getElementById('initial-loader');
          const progressFill = document.getElementById('progress-fill');

          if (loader && progressFill) {
            // 获取 transition 时间，确保进度条跑完
            const transitionDuration = parseFloat(getComputedStyle(progressFill).transitionDuration) * 1000;
            const waitTime = Math.max(transitionDuration, 300);

            // 额外展示时间，让用户看清 100%
            const displayTime = 500;

            setTimeout(() => {
              // 第一阶段：开始 wipe 动画
              loader.classList.add('wiping');

              // 第二阶段：wipe 动画完成后 (0.5s)，开始淡出
              setTimeout(() => {
                loader.classList.add('fade-out');
                // 第三阶段：淡出完成后 (0.5s)，移除元素
                setTimeout(() => loader.remove(), 500);
              }, 500); // wipe duration
            }, waitTime + displayTime);
          } else if (loader) {
            // 降级处理
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 500);
          }
        },

        showcontact() {
          const contactDiv = document.getElementById('loader-contact');
          if (contactDiv) {
            contactDiv.style.display = 'flex';
            contactDiv.style.opacity = '0';
            contactDiv.style.animation = 'fadeIn 1s ease-in-out forwards';
          }
        },
      };

      // 启动动画
      window.__LOADING_PROGRESS__.animate();
      // 初始阶段
      window.__LOADING_PROGRESS__.update('INIT', 100);
      // 15秒后如果还未完成，显示联系方式
      setTimeout(window.__LOADING_PROGRESS__.showcontact, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
