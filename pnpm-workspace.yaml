packages:
  - packages/*
  - apps/*

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  rxdb: true
  unrs-resolver: true

catalog:
  typescript: ~6.0.3
  vite: ^8.3.1
  vitest: ^5.0.3
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  mobx: ^6.16.1
  prettier: 3.9.9
  eslint: ^10.11.0
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  motion: ^13.4.6
  rxdb: 17.5.0
  i18next: ^26.4.2
  zod: ^4.6.5
  rxjs: ^7.8.2
  '@tanstack/react-db': 0.4.1
  '@tanstack/rxdb-db-collection': 0.1.97

# 原生端 react / react-dom 必须与 react-native 内置渲染器（Libraries/Renderer/implementations/*）的
# React 版本完全一致（Expo SDK 的 bundledNativeModules 同样精确钉住），与 web 的 react 相互独立；
# 升级 RN / Expo SDK 时按新渲染器版本同步更新，@types/react 跟随 Expo 期望的 19.2 系列
catalogs:
  native:
    react: 19.2.3
    react-dom: 19.2.3
    '@types/react': ~19.2.18

overrides:
  lightningcss: 1.30.1
  typescript: ~6.0.3
  vite: ^8.3.0
  postcss: '>=8.5.23'
  serialize-javascript: '>=7.0.5'
  decode-uri-component: '>=0.5.0'
  uuid: ^11.1.1
  fast-uri: '>=3.1.6'
