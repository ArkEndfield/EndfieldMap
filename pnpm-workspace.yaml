packages:
  - 'packages/*' # 可发布库
  - 'apps/*' # 应用（不发布）

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  rxdb: true
  unrs-resolver: true

overrides:
  vite: '^8.0.0-beta.13'
  typescript: '~5.9.3'
  lightningcss: '1.30.1'

catalog:
  typescript: '~5.9.3'
  vite: '8.0.0-beta.16'
  vitest: '^4.0.18'
  react: '^19.2.4'
  react-dom: '^19.2.4'
  '@types/react': '^19.2.14'
  '@types/react-dom': '^19.2.3'
  mobx: '^6.15.0'
  prettier: '3.8.1'
  eslint: '^10.0.2'
  tailwindcss: '^4.2.1'
  '@tailwindcss/vite': '^4.2.1'
  '@tailwindcss/postcss': '^4.2.1'
  motion: '^12.34.4'
  rxdb: '^16.21.1'
  i18next: '^25.8.13'
  zod: '^4.3.6'
  rxjs: '^7.8.2'
  '@tanstack/react-db': '^0.1.74'
  '@tanstack/rxdb-db-collection': '^0.1.62'
