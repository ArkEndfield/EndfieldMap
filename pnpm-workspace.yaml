packages:
  - 'packages/*' # 可发布库
  - 'apps/*' # 应用（不发布）

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  rxdb: true
  unrs-resolver: true

overrides:
  vite: '^8.0.0-beta.13'
  typescript: '~5.9.3'
  lightningcss: '1.30.1'

catalog:
  typescript: '~5.9.3'
  vite: '8.0.0-beta.16'
  vitest: '^4.1.10'
  react: '^19.2.7'
  react-dom: '^19.2.7'
  '@types/react': '^19.2.17'
  '@types/react-dom': '^19.2.3'
  mobx: '^6.16.1'
  prettier: '3.9.5'
  eslint: '^10.7.0'
  tailwindcss: '^4.3.2'
  '@tailwindcss/vite': '^4.3.2'
  '@tailwindcss/postcss': '^4.3.2'
  motion: '^12.42.2'
  rxdb: '^17.4.0'
  i18next: '^26.3.6'
  zod: '^4.4.3'
  rxjs: '^7.8.2'
  '@tanstack/react-db': '^0.1.92'
  '@tanstack/rxdb-db-collection': '^0.1.80'
