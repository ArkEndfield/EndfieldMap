$:
  vscode:
    clouddev:
      docker:
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: Install PNPM
          script: npm install -g pnpm
        - name: Install Dependencies
          script: pnpm install
        - name: Build Package
          script: pnpm build

main:
  push:
    - imports: https://cnb.cool/bietiaop/bietiaop-secret-env/-/blob/main/github-for-EndfieldMap.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/bietiaop/EndfieldMap.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
